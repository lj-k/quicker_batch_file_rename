<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'><title>Quicker 结构化调试报告</title>
<meta name='quicker-snapshot-hash' content='f7d66ef4982aec6529196e10345648ffc2fa0c20cab287e03eff49d4f4add048'>
<style>/*
 * Quicker 结构化调试查看器（修订 R：主从式诊断界面）样式。
 * 布局：顶栏工具条 + 横幅 + 主体（左执行树 | 拖动分隔条 | 右步骤详情）。
 * 观感【复用】方案 A / 旧静态渲染器 StyleBlock 的配色与字体（灰阶 + chocolate 警告 + red 错误 + step-id 橙 #e3a664），
 * 但布局与交互按主从式重写。左树为单行行高固定的虚拟列表；右详情面板完整展示值（不再截断/不再 tooltip 展开）。
 *
 * 主题（暗色模式，默认跟随系统）：
 *  - 所有会随主题变化的颜色都抽成 :root 上的语义 CSS 自定义属性（--bg / --fg / --panel-bg / --border / --muted /
 *    --accent / --error / --warning / --stepid / --select-bg …），各处只引用变量，亮色值 == 原有硬编码值（观感不变）。
 *  - 跟随系统：`@media (prefers-color-scheme: dark)` 提供暗色调色板；用 `:root:not([data-theme])` 限定，
 *    仅在“跟随系统”（未设 data-theme）时生效。
 *  - 手动优先：`:root[data-theme="dark"]` 覆写为暗色；手动选“浅色”时设 data-theme="light"，media 因 :not([data-theme]) 失效，
 *    回落到 :root 亮色默认值。三态由工具条的主题下拉控制（见 viewer.js）。
 */

/* ---- 亮色调色板（默认；值即原有硬编码颜色，保证观感不变） ---- */
:root {
    color-scheme: light;        /* 让原生滚动条 / 下拉框等控件按主题渲染 */
    --bg: #fff;                 /* 页面底色 */
    --panel-bg: #fafafa;        /* 工具条 / 输入输出块底色 */
    --input-bg: #fff;           /* 按钮 / 输入框 / 值块 / 分段控件底色 */
    /* 工具栏按钮使用独立底色和轮廓，与输入框及工具栏背景区分。 */
    --toolbar-button-bg: #e4ecf7;
    --toolbar-button-fg: #203854;
    --toolbar-button-border: #7186a1;
    --toolbar-button-hover-bg: #d5e4f7;
    --toolbar-button-hover-border: #497aaa;
    --toolbar-button-active-bg: #bfd4ef;
    --toolbar-button-disabled-bg: #f1f3f6;
    --toolbar-button-disabled-fg: #9ba3ad;
    --toolbar-button-disabled-border: #d7dde5;
    --splitter-bg: #f0f0f0;     /* 分隔条 */
    --hover-bg: #f6f6f6;        /* 树节点 hover */
    --select-bg: #fdf1d6;       /* 选中节点底色 */

    --fg: #555;                 /* 正文前景 */
    --fg-strong: #333;          /* 强调（hover 文字等） */
    --fg-heading: #444;         /* 标题 / 值文字 */
    --muted: #999;              /* 次要说明文字 */
    --muted-2: #888;            /* 更弱说明 / 占位 */
    --dim: #b0b0b0;             /* 极弱（caret / 耗时 / 跳过图标 / null 值） */

    --border: #e6e6e6;          /* 主边框 / 分隔线 */
    --border-light: #eee;       /* 浅边框（小节线 / io 块边） */
    --control-border: #cfcfcf;  /* 按钮 / 输入框边框 */
    --sep: #ddd;                /* 竖向分隔条 */
    --seg-border: #d5d5d5;      /* 分段控件外框 */
    --seg-divider: #e2e2e2;     /* 分段控件按钮分隔 */

    --accent: #f0a500;          /* 主强调橙（选中条 / hover / seg 选中 / 分隔条拖动） */
    --accent-dark: #c07800;     /* 深强调橙（循环项值小节标题） */
    --on-accent: #fff;          /* 强调底上的文字 */
    --link: #2a72c0;            /* 链接 */

    --error: #c0392b;           /* 错误红（失败文案 / 脱敏掩码 / 徽标） */
    --error-border: #e0a79f;    /* “下一个失败”按钮描边 */
    --error-msg: #d33;          /* 错误消息文字 */
    --warning: chocolate;       /* 警告 / 未完成（chocolate/橙） */
    --success: #3aa757;         /* 成功图标 */
    --success-2: #2e7d43;       /* 成功徽标文字 / 已复制 */

    --stepid: #e3a664;          /* step-id 橙 */
    --fail-mark: #e0533a;       /* 失败高亮（图标 / 左边条） */
    --container-icon: #a08bc0;  /* 容器图标 */
    --container-label: #8a6dbf; /* 容器标签文字 */
    --origin: #a08;             /* 输入来源标注（品红） */
    --stack-fg: #8a5a52;        /* 失败堆栈文字 */

    --mark-bg: #ffe066;         /* 搜索命中高亮底 */
    --mark-fg: #663c00;         /* 搜索命中高亮字 */
    --search-row-bg: #fff8d8;   /* 左树含匹配的行 */
    --search-current-bg: #ffe9a8; /* 当前匹配行/详情目标 */

    --badge-success-bg: #e6f4ea; --badge-success-fg: #2e7d43;
    --badge-failed-bg: #fdecea;  --badge-failed-fg: #c0392b;
    --badge-skipped-bg: #eee;    --badge-skipped-fg: #888;
    --badge-incomplete-bg: #fdf0e2; --badge-incomplete-fg: chocolate;

    --failure-bg: #fdf3f1;      --failure-border: #f3c9c2;

    --loopitem-border: #f0d9a8; /* 循环项值小节标题下划线 */
    --loopitem-io-bg: #fffdf6;  /* 循环项值块底色 */

    --copy-bg: rgba(255, 255, 255, 0.9);
    --copy-fg: #777;
    --copied-fg: #2e7d43;
    --copied-border: #9ccfab;
}

/* ---- 暗色调色板 ---- */
/* 跟随系统：仅当未手动指定 data-theme 时，随系统暗色生效。 */
@media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
        color-scheme: dark;     /* 跟随系统暗色时，原生滚动条 / 控件也用暗色 */
        --bg: #1e1e1e;
        --panel-bg: #252526;
        --input-bg: #2d2d30;
        /* 工具栏按钮使用独立底色和轮廓，与输入框及工具栏背景区分。 */
        --toolbar-button-bg: #34465e;
        --toolbar-button-fg: #eff5ff;
        --toolbar-button-border: #839bb9;
        --toolbar-button-hover-bg: #435a79;
        --toolbar-button-hover-border: #9bbfed;
        --toolbar-button-active-bg: #263a55;
        --toolbar-button-disabled-bg: #292d34;
        --toolbar-button-disabled-fg: #737c89;
        --toolbar-button-disabled-border: #404751;
        --splitter-bg: #333333;
        --hover-bg: #2a2d2e;
        --select-bg: #3a331f;

        --fg: #cccccc;
        --fg-strong: #e6e6e6;
        --fg-heading: #dcdcdc;
        --muted: #9a9a9a;
        --muted-2: #8a8a8a;
        --dim: #7a7a7a;

        --border: #3a3a3a;
        --border-light: #333333;
        --control-border: #4a4a4a;
        --sep: #444444;
        --seg-border: #4a4a4a;
        --seg-divider: #3a3a3a;

        --accent: #f0a500;
        --accent-dark: #e0a44e;
        --on-accent: #1e1e1e;
        --link: #5aa2e0;

        --error: #f28b82;
        --error-border: #7a3b34;
        --error-msg: #f28b82;
        --warning: #e6a866;
        --success: #6cc08a;
        --success-2: #7bd39a;

        --stepid: #e3a664;
        --fail-mark: #f2795e;
        --container-icon: #b39ddb;
        --container-label: #b39ddb;
        --origin: #d08bd0;
        --stack-fg: #c99b90;

        --mark-bg: #7a6414;
        --mark-fg: #ffe9a8;
        --search-row-bg: #3c361f;
        --search-current-bg: #57491e;

        --badge-success-bg: #1e3a28; --badge-success-fg: #7bd39a;
        --badge-failed-bg: #3a1f1c;  --badge-failed-fg: #f28b82;
        --badge-skipped-bg: #333333; --badge-skipped-fg: #aaaaaa;
        --badge-incomplete-bg: #3a2e1c; --badge-incomplete-fg: #e6a866;

        --failure-bg: #2c1f1d;      --failure-border: #5a352f;

        --loopitem-border: #5a4a24;
        --loopitem-io-bg: #2a2519;

        --copy-bg: rgba(45, 45, 48, 0.9);
        --copy-fg: #aaaaaa;
        --copied-fg: #7bd39a;
        --copied-border: #3f6b4a;
    }
}

/* 手动“深色”：优先级高于 media（media 已被 :not([data-theme]) 限定）。 */
:root[data-theme="dark"] {
    color-scheme: dark;         /* 手动深色时，原生滚动条 / 控件也用暗色 */
    --bg: #1e1e1e;
    --panel-bg: #252526;
    --input-bg: #2d2d30;
    /* 工具栏按钮使用独立底色和轮廓，与输入框及工具栏背景区分。 */
    --toolbar-button-bg: #34465e;
    --toolbar-button-fg: #eff5ff;
    --toolbar-button-border: #839bb9;
    --toolbar-button-hover-bg: #435a79;
    --toolbar-button-hover-border: #9bbfed;
    --toolbar-button-active-bg: #263a55;
    --toolbar-button-disabled-bg: #292d34;
    --toolbar-button-disabled-fg: #737c89;
    --toolbar-button-disabled-border: #404751;
    --splitter-bg: #333333;
    --hover-bg: #2a2d2e;
    --select-bg: #3a331f;

    --fg: #cccccc;
    --fg-strong: #e6e6e6;
    --fg-heading: #dcdcdc;
    --muted: #9a9a9a;
    --muted-2: #8a8a8a;
    --dim: #7a7a7a;

    --border: #3a3a3a;
    --border-light: #333333;
    --control-border: #4a4a4a;
    --sep: #444444;
    --seg-border: #4a4a4a;
    --seg-divider: #3a3a3a;

    --accent: #f0a500;
    --accent-dark: #e0a44e;
    --on-accent: #1e1e1e;
    --link: #5aa2e0;

    --error: #f28b82;
    --error-border: #7a3b34;
    --error-msg: #f28b82;
    --warning: #e6a866;
    --success: #6cc08a;
    --success-2: #7bd39a;

    --stepid: #e3a664;
    --fail-mark: #f2795e;
    --container-icon: #b39ddb;
    --container-label: #b39ddb;
    --origin: #d08bd0;
    --stack-fg: #c99b90;

    --mark-bg: #7a6414;
    --mark-fg: #ffe9a8;
    --search-row-bg: #3c361f;
    --search-current-bg: #57491e;

    --badge-success-bg: #1e3a28; --badge-success-fg: #7bd39a;
    --badge-failed-bg: #3a1f1c;  --badge-failed-fg: #f28b82;
    --badge-skipped-bg: #333333; --badge-skipped-fg: #aaaaaa;
    --badge-incomplete-bg: #3a2e1c; --badge-incomplete-fg: #e6a866;

    --failure-bg: #2c1f1d;      --failure-border: #5a352f;

    --loopitem-border: #5a4a24;
    --loopitem-io-bg: #2a2519;

    --copy-bg: rgba(45, 45, 48, 0.9);
    --copy-fg: #aaaaaa;
    --copied-fg: #7bd39a;
    --copied-border: #3f6b4a;
}
/* 手动“浅色”（data-theme="light"）无需单独声明：media 被 :not([data-theme]) 限定后自动失效，回落到 :root 亮色默认值。 */

html, body { height: 100%; margin: 0; }
body {
    font-size: 14px;
    color: var(--fg);
    font-family: "Microsoft YaHei", "Segoe UI", Tahoma, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
}
#qk-fallback { padding: 24px; color: var(--muted-2); }

/* ---- 工具条 ---- */
#qk-toolbar {
    flex: 0 0 auto;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: center;
    font-size: 13px;
}
#qk-toolbar button {
    box-sizing: border-box;
    font-size: 12px;
    font-weight: 600;
    line-height: 18px;
    min-height: 28px;
    padding: 3px 10px;
    cursor: pointer;
    background: var(--toolbar-button-bg);
    border: 1px solid var(--toolbar-button-border);
    border-radius: 4px;
    color: var(--toolbar-button-fg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
}
#qk-toolbar button:not(:disabled):hover {
    background: var(--toolbar-button-hover-bg);
    border-color: var(--toolbar-button-hover-border);
}
#qk-toolbar button:not(:disabled):active,
#qk-toolbar button[aria-expanded="true"] {
    background: var(--toolbar-button-active-bg);
    border-color: var(--toolbar-button-hover-border);
    box-shadow: inset 0 0 0 1px var(--toolbar-button-hover-border);
}
#qk-toolbar button:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
}
#qk-toolbar button:disabled {
    opacity: 1;
    cursor: default;
    background: var(--toolbar-button-disabled-bg);
    color: var(--toolbar-button-disabled-fg);
    border-color: var(--toolbar-button-disabled-border);
    box-shadow: none;
}
#qk-toolbar .qk-sep { width: 1px; height: 18px; background: var(--sep); }
#qk-search {
    font-size: 13px;
    padding: 3px 6px;
    min-width: 200px;
    border: 1px solid var(--control-border);
    border-radius: 3px;
    background: var(--input-bg);
    color: var(--fg);
}
#qk-status-filter, #qk-theme {
    font-size: 13px;
    padding: 3px 4px;
    border: 1px solid var(--control-border);
    border-radius: 3px;
    background: var(--input-bg);
    color: var(--fg);
}
#qk-search-nav { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
#qk-search-nav button { min-width: 28px; padding-left: 6px; padding-right: 6px; }
#qk-search-pos { color: var(--muted); font-size: 12px; min-width: 42px; text-align: center; }
#qk-search-context {
    color: var(--muted-2);
    font-size: 12px;
    max-width: 420px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
#qk-count { color: var(--muted); font-size: 12px; margin-left: auto; }
#qk-toolbar #qk-btn-nextissue:not(:disabled) { color: var(--error); border-color: var(--error-border); background: var(--failure-bg); }

/* ---- 会话级运行环境与动作身份 ---- */
#qk-report-info {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
    font-size: 12px;
    line-height: 20px;
    white-space: nowrap;
    overflow-x: auto;
}
#qk-report-info .qk-report-info-sep { flex: 0 0 14px; }
#qk-report-info .qk-mono { font-family: Consolas, "Courier New", monospace; }
#qk-report-info .qk-source-revision { margin-left: 6px; font-size: inherit; }
#qk-report-info a { color: var(--link); text-decoration: none; }
#qk-report-info a:hover { text-decoration: underline; }

/* ---- 首屏诊断摘要 / 最慢步骤 ---- */
#qk-summary {
    flex: 0 0 auto;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
}
.qk-summary-main { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.qk-summary-title { color: var(--fg-heading); font-weight: bold; margin-right: 4px; }
.qk-summary-chip {
    border: 1px solid var(--control-border);
    border-radius: 12px;
    background: var(--input-bg);
    color: var(--muted-2);
    padding: 2px 9px;
    cursor: pointer;
    font-size: 12px;
}
.qk-summary-chip:hover:not(:disabled) { border-color: var(--accent); color: var(--fg-strong); }
.qk-summary-chip:disabled { opacity: 0.45; cursor: default; }
.qk-summary-chip strong { color: var(--fg-heading); }
.qk-summary-chip.qk-summary-attention,
.qk-summary-chip.qk-summary-failed { border-color: var(--error-border); color: var(--error); }
#qk-slowest-panel {
    margin-top: 7px;
    max-width: 720px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px;
    background: var(--panel-bg);
}
.qk-slowest-title { color: var(--muted); font-size: 12px; margin: 0 4px 4px; }
.qk-slowest-row {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: 0;
    border-radius: 3px;
    background: transparent;
    color: var(--fg);
    padding: 4px 6px;
    cursor: pointer;
    text-align: left;
}
.qk-slowest-row:hover { background: var(--hover-bg); }
.qk-slowest-row strong { color: var(--dim); font-size: 12px; }

/* ---- 横幅（报告文件行 / 未完成中断） ---- */
#qk-banners { flex: 0 0 auto; }
#qk-banners .qk-banner { margin: 4px 10px; font-size: 0.9em; white-space: pre-wrap; }
#qk-banners .qk-banner a { color: var(--link); text-decoration: none; }
#qk-banners .qk-banner a:hover { text-decoration: underline; }
.qk-banner-info { color: var(--muted-2); }
.qk-banner-warning { color: var(--warning); font-weight: bold; }

/* ---- 主体：左树 | 分隔条 | 右详情 ---- */
#qk-main { flex: 1 1 auto; display: flex; min-height: 0; }
#qk-tree-pane {
    flex: 0 0 auto;
    width: 38%;
    min-width: 220px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-height: 0;
}
#qk-splitter {
    flex: 0 0 auto;
    width: 5px;
    cursor: col-resize;
    background: var(--splitter-bg);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
}
#qk-splitter:hover, #qk-splitter.qk-dragging { background: var(--accent); }
#qk-detail-pane {
    flex: 1 1 auto;
    min-width: 0;
    overflow: auto;
    padding: 12px 16px;
}

/* ---- 左执行树（固定行高虚拟列表） ---- */
#qk-tree-scroll { flex: 1 1 auto; overflow: auto; position: relative; outline: none; }
#qk-tree-spacer { position: relative; width: 100%; }
#qk-tree-rows { position: absolute; top: 0; left: 0; right: 0; will-change: transform; }
#qk-tree-empty { padding: 18px 12px; color: var(--muted); }

.qk-node {
    height: 24px;
    line-height: 24px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    cursor: pointer;
    font-size: 13px;
    box-sizing: border-box;
    padding-right: 8px;
    border-left: 3px solid transparent;
}
.qk-node:hover { background: var(--hover-bg); }
.qk-node.qk-selected { background: var(--select-bg); border-left-color: var(--accent); }
.qk-node.qk-status-failed { border-left-color: var(--fail-mark); }
.qk-node.qk-status-incomplete { border-left-color: var(--warning); }
.qk-node.qk-disabled { opacity: 0.5; }
.qk-node.qk-search-hit { background: var(--search-row-bg); }
.qk-node.qk-search-current-row { background: var(--search-current-bg); border-left-color: var(--accent); }
.qk-node.qk-search-ancestor .qk-caret { color: var(--accent-dark); }

.qk-caret {
    flex: 0 0 auto;
    width: 14px;
    text-align: center;
    color: var(--dim);
    font-size: 10px;
    user-select: none;
}
.qk-caret.qk-caret-empty { visibility: hidden; }
.qk-icon { flex: 0 0 auto; width: 16px; text-align: center; margin-right: 2px; }
.qk-icon-success { color: var(--success); }
.qk-icon-failed { color: var(--fail-mark); }
.qk-icon-skipped { color: var(--dim); }
.qk-icon-incomplete { color: var(--warning); }
.qk-icon-canceled { color: var(--dim); }
.qk-icon-container { color: var(--container-icon); }
.qk-node-sid { flex: 0 0 auto; color: var(--stepid); margin-right: 6px; font-size: 0.85em; }
.qk-node-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
.qk-node-summary { color: var(--muted); margin-left: 7px; font-size: 0.92em; }
.qk-node.qk-container .qk-node-label { color: var(--container-label); }
.qk-node-start { flex: 0 0 auto; color: var(--muted); font-size: 0.8em; margin-left: 8px; }
.qk-node-dur { flex: 0 0 auto; color: var(--dim); font-size: 0.8em; margin-left: 6px; }

        function hideVariablePicker() {

        function wireVariablePickers() {

                    if (e.key === 'Escape') { hideVariablePicker(); e.preventDefault(); return; }

                        chooseVariableCandidate(variableCandidatesEl.children[activeVariableOption]); e.preventDefault(); return;

            var uploadfile = toolbarEl.querySelector('#qk-btn-uploadfile');
            if (uploadfile) uploadfile.addEventListener('click', function () {
                nav('quicker:uploaddebugfile:' + META.reportPath);
            });
            var invocations = toolbarEl.querySelector('#qk-btn-invocations');
            if (invocations) invocations.addEventListener('click', function () {
                nav(META.relatedInvocationsUrl);
            });
        }

        // ---- 会话级运行环境与动作身份 ----
        function buildReportInfo() {
            var items = [];
            if (META.quickerVersion || META.operatingSystem) {
                items.push('Quicker-' + esc(META.quickerVersion || '?') + '@Win-' + esc(META.operatingSystem || '?'));
            }
            if (META.actionId) {
                items.push('动作ID:<span class="qk-mono">' + esc(META.actionId) + '</span>');
            }
            if (META.sourceActionId) {
                var sourceUrl = 'https://getquicker.net/Sharedaction?code=' + encodeURIComponent(META.sourceActionId);
                var source = '来源动作:<a class="qk-mono" href="' + esc(sourceUrl) +
                    '" target="_blank" rel="noopener noreferrer">' + esc(META.sourceActionId) + '</a>';
                if (META.sourceActionRevision !== null && META.sourceActionRevision !== undefined) {
                    source += '<span class="qk-source-revision qk-mono">v' +
                        esc(META.sourceActionRevision) + '</span>';
                }
                items.push(source);
            }

            reportInfoEl.innerHTML = items.join('<span class="qk-report-info-sep"></span>');
            reportInfoEl.hidden = items.length === 0;
        }

        // ---- 横幅：报告文件行 + 未完成/中断 ----
        function buildBanners() {
            var html = '';
            if (META.reportPath) {
                html += '<div class="qk-banner qk-banner-info">调试报告：' + esc(META.reportPath) + '</div>';
            }
            if (META.relatedInvocationsUrl) {
                html += '<div class="qk-banner qk-banner-info">此动作创建了可触发子程序的窗口。' +
                    '<a href="' + esc(META.relatedInvocationsUrl) + '">查看后续交互调用报告</a></div>';
            }
            if (META.sessionComplete === false) {
                var reason = META.manifestTerminal
                    ? '会话有未完成（无终态）步骤，可能中途中断。'
                    : '会话未正常结束（manifest 停留 Running / 缺失），可能被强制中断。';
                html += '<div class="qk-banner qk-banner-warning">⚠ 未完成 / 中断：' + esc(reason) +
                    '（未完成步骤 ' + (META.incompleteCount || 0) + ' 个）已有事件仍完整可读。</div>';
            }
            bannersEl.innerHTML = html;
        }

        // ---- 搜索：保留执行树，只维护字段级匹配与上/下一条定位 ----
        function rebuildSearchMatches(selectFirst) {
            if (!query && autoExpandedForSearch.size) {
                autoExpandedForSearch.forEach(function (nodeId) { collapsed.add(nodeId); });
                autoExpandedForSearch.clear();
            }

            searchMatches = collectSearchMatches(FLAT, query, VALUES, statusMode, searchValueCache);
            var counts = buildSearchMatchCounts(FLAT, searchMatches);
            ownMatchCounts = counts.ownCounts;
            subtreeMatchCounts = counts.subtreeCounts;
            hits = counts.hitIndices;
            currentSearchMatch = -1;
            rebuildVisible();

            if (searchMatches.length) {
                var first = 0;
                if (selectFirst && selectedFlatIdx >= 0) {
                    for (var i = 0; i < searchMatches.length; i++) {
                        if (searchMatches[i].flatIdx === selectedFlatIdx) { first = i; break; }
                    }
                }
                selectSearchMatch(first);
            } else {
                if (selectedFlatIdx >= 0) {
                    detailEl.innerHTML = renderDetail(FLAT[selectedFlatIdx].node);
                    detailEl.scrollTop = 0;
                }
                updateSearchNavigation();
                renderWindow();
            }
        }

        function jumpSearchMatch(direction) {
            if (!searchMatches.length) return;
            var next = currentSearchMatch < 0
                ? (direction < 0 ? searchMatches.length - 1 : 0)
                : (currentSearchMatch + direction + searchMatches.length) % searchMatches.length;
            selectSearchMatch(next);
        }

        function selectSearchMatch(index) {
            if (index < 0 || index >= searchMatches.length) return;
            currentSearchMatch = index;
            var match = searchMatches[index];
            selectByFlatIdx(match.flatIdx, true, index);
        }

        function searchMatchPath(flatIdx) {
            var labels = [], current = flatIdx;
            while (current >= 0) {
                var node = FLAT[current].node;
                var label = node.kind === 'step'
                    ? (node.stepId ? '#' + node.stepId + ' ' : '') + (node.title || '(步骤)')
                    : containerLabelPlain(node);
                labels.push(label);
                current = FLAT[current].parent;
            }
            labels.reverse();
            return labels.join(' › ');
        }

        function searchSnippet(text, qLower, maxLength) {
            var value = String(text || '').replace(/\s+/g, ' ').trim();
            if (!value) return '';
            var lower = value.toLowerCase(), at = lower.indexOf(qLower);
            var limit = maxLength || 90;
            if (value.length <= limit) return value;
            var start = Math.max(0, at - Math.floor(limit / 3));
            var end = Math.min(value.length, start + limit);
            if (end - start < limit) start = Math.max(0, end - limit);
            return (start ? '…' : '') + value.slice(start, end) + (end < value.length ? '…' : '');
        }

        function updateSearchNavigation() {
            var prev = document.getElementById('qk-search-prev');
            var next = document.getElementById('qk-search-next');
            var pos = document.getElementById('qk-search-pos');
            var context = document.getElementById('qk-search-context');
            var enabled = searchMatches.length > 0;
            if (prev) prev.disabled = !enabled;
            if (next) next.disabled = !enabled;
            if (pos) pos.textContent = enabled
                ? (currentSearchMatch >= 0 ? currentSearchMatch + 1 : '—') + ' / ' + searchMatches.length
                : '0 / 0';
            if (context) {
                var match = enabled && currentSearchMatch >= 0 ? searchMatches[currentSearchMatch] : null;
                var text = match
                    ? searchMatchPath(match.flatIdx) + ' · ' + match.label + ' · ' + searchSnippet(match.text, query.toLowerCase(), 90)
                    : (query ? (enabled ? '已标记 ' + searchMatches.length + ' 条匹配' : '无匹配') : '');
                context.textContent = text;
                context.title = text;
            }
        }

        // ---- 左树可见集派生 ----
        function rebuildVisible() {
            var r = computeVisible(FLAT, collapsed, statusMode, '');
            visible = r.indices;
            spacerEl.style.height = (visible.length * ROW_H) + 'px';
            var c = document.getElementById('qk-count');
            if (c) {
                var matchedSteps = hits ? hits.size : 0;
                c.textContent = '可见 ' + visible.length + ' / 共 ' + FLAT.length + ' 节点' +
                    (query ? ' · 匹配 ' + searchMatches.length + ' 条 / ' + matchedSteps + ' 个节点' : '');
            }
            renderWindow();
        }

        // ---- 定高虚拟窗口渲染 ----
        var renderPending = false;
        function requestRender() {
            if (renderPending) return;
            renderPending = true;
            requestAnimationFrame(function () { renderPending = false; renderWindow(); });
        }

        function renderWindow() {
            var total = visible.length;
            if (total === 0) {
                rowsEl.innerHTML = '';
                rowsEl.style.transform = 'translateY(0)';
                if (!document.getElementById('qk-tree-empty')) {
                    var em = document.createElement('div');
                    em.id = 'qk-tree-empty';
                    em.textContent = '无匹配节点。';
                    spacerEl.appendChild(em);
                }
                return;
            }
            var em0 = document.getElementById('qk-tree-empty');
            if (em0) em0.remove();

            var top = scrollEl.scrollTop;
            var vh = scrollEl.clientHeight || 600;
            var start = Math.max(0, Math.floor(top / ROW_H) - OVERSCAN);
            var end = Math.min(total, Math.ceil((top + vh) / ROW_H) + OVERSCAN);

            var html = '';
            for (var pos = start; pos < end; pos++) html += nodeRowHtml(visible[pos]);
            rowsEl.style.transform = 'translateY(' + (start * ROW_H) + 'px)';
            rowsEl.innerHTML = html;
        }

        function nodeRowHtml(flatIdx) {
            var f = FLAT[flatIdx];
            var node = f.node;
            var isHit = hits && hits.has(flatIdx);
            var sel = flatIdx === selectedFlatIdx;
            var ownCount = ownMatchCounts[flatIdx] || 0;
            var subtreeCount = subtreeMatchCounts[flatIdx] || 0;
            var isCurrentMatchRow = currentSearchMatch >= 0 &&
                searchMatches[currentSearchMatch] && searchMatches[currentSearchMatch].flatIdx === flatIdx;

            var cls = 'qk-node';
            if (sel) cls += ' qk-selected';
            if (ownCount) cls += ' qk-search-hit';
            else if (subtreeCount) cls += ' qk-search-ancestor';
            if (isCurrentMatchRow) cls += ' qk-search-current-row';
            if (node.status === 'failed') cls += ' qk-status-failed';
            else if (node.status === 'incomplete') cls += ' qk-status-incomplete';
            if (node.disabled) cls += ' qk-disabled';
            if (isContainerKind(node.kind)) cls += ' qk-container';

            var isCollapsed = !isTreeFiltering() && collapsed.has(node.id);
            var caret = f.collapsible
                ? '<span class="qk-caret" data-caret="1">' + (isCollapsed ? '▶' : '▼') + '</span>'
                : '<span class="qk-caret qk-caret-empty">·</span>';

            var sm = statusMeta(node.status);
            var icon = sm
                ? '<span class="qk-icon ' + sm.cls + '">' + sm.icon + '</span>'
                : '<span class="qk-icon qk-icon-container">' + containerIcon(node.kind) + '</span>';

            var sid = (node.kind === 'step' && node.stepId)
                ? '<span class="qk-node-sid">#' + esc(node.stepId) + '</span>' : '';

            var labelPlain = nodeLabelText(node);
            var labelText = esc(labelPlain);
            var summaryPlain = node.kind === 'step' ? (node.summary || '') : '';
            var summaryText = esc(summaryPlain);
            if (isHit) {
                labelText = markHits(labelText, qEscLower);
                summaryText = markHits(summaryText, qEscLower);
            }
            var fullLabel = summaryPlain ? labelPlain + '  ' + summaryPlain : labelPlain;
            var summary = summaryPlain
                ? '<span class="qk-node-summary">' + summaryText + '</span>' : '';
            var label = '<span class="qk-node-label" title="' + esc(fullLabel) + '">' +
                '<span class="qk-node-title">' + labelText + '</span>' + summary + '</span>';
            var badgeCount = ownCount || (isCollapsed ? subtreeCount : 0);
            var matchBadge = badgeCount
                ? '<span class="qk-match-count" title="' + badgeCount + ' 个搜索匹配">' + badgeCount + '</span>'
                : '';

            // 注释和跳过的步骤不在执行树中显示时间，详情仍保留原始时序。
            var showTiming = node.runnerKey !== 'sys:comment' && !node.disabled && node.status !== 'skipped';
            // 本步骤自身耗时。
            var dur = (showTiming && node.durationMs !== null && node.durationMs !== undefined)
                ? '<span class="qk-node-dur" title="本步骤耗时">+' + esc(fmtDur(node.durationMs)) + '</span>' : '';
            // 起始偏移：从动作开始到本步骤开始执行的时间（node.elapsedMs），供从总体上感知"多久跑到哪一步"。
            var start = (showTiming && node.elapsedMs !== null && node.elapsedMs !== undefined)
                ? '<span class="qk-node-start" title="距动作开始（墙钟 ' + esc(fmtTimeTitle(META.startedUtc, node.elapsedMs)) + '）">' + esc(Math.round(node.elapsedMs)) + 'ms</span>' : '';

            var pad = f.depth * INDENT;
            var expandedAttr = f.collapsible ? ' aria-expanded="' + (!isCollapsed) + '"' : '';
            return '<div class="' + cls + '" data-i="' + flatIdx + '" role="treeitem" aria-level="' + (f.depth + 1) +
                '" aria-selected="' + sel + '"' + expandedAttr + ' style="padding-left:' + pad + 'px">' +
                caret + icon + sid + label + matchBadge + dur + start + '</div>';
        }

        // ---- 左树交互：折叠 / 选中 ----
        function onTreeClick(e) {
            var rowEl = closest(e.target, 'qk-node', rowsEl);
            if (!rowEl) return;
            scrollEl.focus();
            var flatIdx = parseInt(rowEl.getAttribute('data-i'), 10);
            var caretEl = closest(e.target, 'qk-caret', rowsEl);
            if (caretEl && caretEl.getAttribute('data-caret') === '1') {
                selectByFlatIdx(flatIdx, false);
                if (isTreeFiltering()) return;
                var node = FLAT[flatIdx].node;
                if (collapsed.has(node.id)) expandByFlatIdx(flatIdx); else collapseByFlatIdx(flatIdx);
                return;
            }
            selectByFlatIdx(flatIdx, false);
        }

        function onTreeKeyDown(e) {
            if (e.altKey || e.ctrlKey || e.metaKey) return;

            var target = -1;
            var handled = false;
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                target = findVisibleNeighbor(visible, selectedFlatIdx, e.key === 'ArrowUp' ? -1 : 1);
                if (target >= 0) {
                    selectByFlatIdx(target, false);
                    handled = true;
                }
            } else if (e.key === 'ArrowLeft' && selectedFlatIdx >= 0) {
                var leftItem = FLAT[selectedFlatIdx];
                if (!isTreeFiltering() && leftItem.collapsible && !collapsed.has(leftItem.node.id)) {
                    handled = collapseByFlatIdx(selectedFlatIdx);
                } else if (leftItem.parent >= 0) {
                    selectByFlatIdx(leftItem.parent, false);
                    handled = true;
                }
            } else if (e.key === 'ArrowRight' && selectedFlatIdx >= 0) {
                var rightItem = FLAT[selectedFlatIdx];
                if (!isTreeFiltering() && rightItem.collapsible && collapsed.has(rightItem.node.id)) {
                    handled = expandByFlatIdx(selectedFlatIdx);
                } else {
                    target = firstVisibleChild(selectedFlatIdx);
                    if (target >= 0) {
                        selectByFlatIdx(target, false);
                        handled = true;
                    }
                }
            }

            if (handled) {
                e.preventDefault();
                e.stopPropagation();
            }
        }

        function isTreeFiltering() {
            return statusMode !== 'all';
        }

        function firstVisibleChild(flatIdx) {
            var pos = visible.indexOf(flatIdx);
            if (pos < 0) return -1;
            for (var i = pos + 1; i < visible.length; i++) {
                var candidate = visible[i];
                if (FLAT[candidate].depth <= FLAT[flatIdx].depth) break;
                if (FLAT[candidate].parent === flatIdx) return candidate;
            }
            return -1;
        }

        function collapseByFlatIdx(flatIdx) {
            var item = FLAT[flatIdx];
            if (!item || !item.collapsible || collapsed.has(item.node.id)) return false;

            collapsed.add(item.node.id);
            autoExpandedForSearch.delete(item.node.id);
            var selection = selectionAfterCollapse(FLAT, selectedFlatIdx, flatIdx);
            rebuildVisible();
            if (selection !== selectedFlatIdx) selectByFlatIdx(selection, false);
            else if (selectedFlatIdx >= 0) scrollIntoView(selectedFlatIdx);
            return true;
        }

        function expandByFlatIdx(flatIdx) {
            var item = FLAT[flatIdx];
            if (!item || !item.collapsible || !collapsed.has(item.node.id)) return false;
            collapsed.delete(item.node.id);
            rebuildVisible();
            if (selectedFlatIdx >= 0) scrollIntoView(selectedFlatIdx);
            return true;
        }

        function selectByFlatIdx(flatIdx, reveal, preferredMatchIndex) {
            if (flatIdx !== selectedFlatIdx) { extraVariableLimit = 8; extraVariableHistories.clear(); }
            activeVariableAccess = null;
            selectedFlatIdx = flatIdx;
            if (flatIdx < 0) {
                currentSearchMatch = -1;
                detailEl.innerHTML = renderDetail(null);
                updateSearchNavigation();
                renderWindow();
                return;
            }
            if (reveal) revealAncestors(flatIdx, query && preferredMatchIndex !== undefined);
            // 摘要、问题导航、循环定位等直接定位若命中了当前筛选之外的节点，自动清除筛选，
            // 确保用户点击后一定能在左树看到目标，而不是只更新右侧详情。
            if (reveal && visible.indexOf(flatIdx) < 0 && statusMode !== 'all') {
                statusMode = 'all';
                var statusSelect = toolbarEl.querySelector('#qk-status-filter');
                if (statusSelect) statusSelect.value = 'all';
                searchMatches = collectSearchMatches(FLAT, query, VALUES, statusMode, searchValueCache);
                var counts = buildSearchMatchCounts(FLAT, searchMatches);
                ownMatchCounts = counts.ownCounts;
                subtreeMatchCounts = counts.subtreeCounts;
                hits = counts.hitIndices;
                rebuildVisible();
            }
            // 选中项若被折叠隐藏，重算可见集以纳入其祖先链。
            if (visible.indexOf(flatIdx) < 0) rebuildVisible();

            if (preferredMatchIndex !== undefined && searchMatches[preferredMatchIndex] &&
                searchMatches[preferredMatchIndex].flatIdx === flatIdx) {
                currentSearchMatch = preferredMatchIndex;
            } else {
                currentSearchMatch = -1;
                for (var i = 0; i < searchMatches.length; i++) {
                    if (searchMatches[i].flatIdx === flatIdx) { currentSearchMatch = i; break; }
                }
            }
            prepareDetailForSearchMatch(currentSearchMatch >= 0 ? searchMatches[currentSearchMatch] : null);
            detailEl.innerHTML = renderDetail(FLAT[flatIdx].node);
            detailEl.scrollTop = 0;
            highlightCurrentSearchMatch();
            updateSearchNavigation();
            renderWindow();
            scrollIntoView(flatIdx);
        }

        function revealAncestors(flatIdx, trackSearchExpansion) {
            var p = FLAT[flatIdx].parent;
            while (p >= 0) {
                var nodeId = FLAT[p].node.id;
                if (trackSearchExpansion && collapsed.has(nodeId)) autoExpandedForSearch.add(nodeId);
                collapsed.delete(nodeId);
                p = FLAT[p].parent;
            }
            rebuildVisible();
        }

        function selectNearestVisibleAncestor() {
            if (selectedFlatIdx >= 0 && visible.indexOf(selectedFlatIdx) < 0) {
                var target = FLAT[selectedFlatIdx].parent;
                while (target >= 0 && visible.indexOf(target) < 0) target = FLAT[target].parent;
                selectByFlatIdx(target >= 0 ? target : (visible.length ? visible[0] : -1), false);
            }
        }

        // ---- 首屏诊断摘要 / 最慢步骤 ----
        function buildSummary() {
            var stats = summarizeFlat(FLAT);
            var slow = topSlowSteps(FLAT, 10);
            function chip(filter, label, count, cls) {
                return '<button class="qk-summary-chip ' + (cls || '') + '" data-summary-filter="' + filter + '"' +
                    (count ? '' : ' disabled') + '>' + label + ' <strong>' + count + '</strong></button>';
            }
            var html = '<div class="qk-summary-main"><span class="qk-summary-title">执行概览</span>' +
                chip('all', '步骤', stats.steps) +
                chip('attention', '需关注', stats.attention, stats.attention ? 'qk-summary-attention' : '') +
                chip('failed', '失败', stats.failed, stats.failed ? 'qk-summary-failed' : '') +
                chip('incomplete', '未完成', stats.incomplete) +
                chip('canceled', '已取消', stats.canceled) +
                chip('message', '警告/错误', stats.warnings + stats.errors) +
                '<button class="qk-summary-chip" id="qk-show-slowest"' + (slow.length ? '' : ' disabled') +
                '>最慢步骤</button></div>';
            if (slow.length) {
                html += '<div id="qk-slowest-panel" hidden><div class="qk-slowest-title">最慢步骤（点击定位）</div>';
                for (var i = 0; i < slow.length; i++) {
                    var item = slow[i], node = item.node;
                    html += '<button class="qk-slowest-row" data-select-flat="' + item.flatIdx + '">' +
                        '<span>' + (node.stepId ? '#' + esc(node.stepId) + ' ' : '') + esc(node.title || '(步骤)') + '</span>' +
                        '<strong>' + esc(fmtDur(node.durationMs)) + '</strong></button>';
                }
                html += '</div>';
            }
            summaryEl.innerHTML = html;
        }

        function onSummaryClick(e) {
            var target = e.target;
            if (!target || !target.getAttribute) return;
            var row = closest(target, 'qk-slowest-row', summaryEl);
            if (row) {
                var flatIdx = parseInt(row.getAttribute('data-select-flat'), 10);
                var panel = document.getElementById('qk-slowest-panel');
                if (panel) panel.hidden = true;
                selectByFlatIdx(flatIdx, true);
                return;
            }
            var chip = closest(target, 'qk-summary-chip', summaryEl);
            if (!chip || chip.disabled) return;
            if (chip.id === 'qk-show-slowest') {
                var slowPanel = document.getElementById('qk-slowest-panel');
                if (slowPanel) slowPanel.hidden = !slowPanel.hidden;
                return;
            }
            var filter = chip.getAttribute('data-summary-filter');
            if (filter) {
                statusMode = filter;
                var select = toolbarEl.querySelector('#qk-status-filter');
                if (select) select.value = filter;
                rebuildSearchMatches(true);
            }
        }

        function scrollIntoView(flatIdx) {
            var pos = visible.indexOf(flatIdx);
            if (pos < 0) return;
            var y = pos * ROW_H;
            var vh = scrollEl.clientHeight || 600;
            if (y < scrollEl.scrollTop || y + ROW_H > scrollEl.scrollTop + vh) {
                scrollEl.scrollTop = Math.max(0, y - vh / 2);
                renderWindow();
            }
        }

        function jumpNextAttention() {
            if (!FLAT.length) return;
            var next = findNextIndex(FLAT, isAttentionNode, selectedFlatIdx < 0 ? -1 : selectedFlatIdx);
            if (next < 0) { flashNoAttention(); return; }
            selectByFlatIdx(next, true);
        }
        function flashNoAttention() {
            var btn = toolbarEl.querySelector('#qk-btn-nextissue');
            if (!btn) return;
            var t = btn.textContent; btn.textContent = '没有需关注的问题';
            setTimeout(function () { btn.textContent = t; }, 900);
        }

        // ---- 右详情面板 ----
        function renderDetail(node) {
            copyTexts = [];
            if (!node) return '<div class="qk-detail-empty">在左侧执行树选择一个步骤查看详情。</div>';

            var h = breadcrumbBlock(selectedFlatIdx) + titleBlock(node) + metaBlock(node);
            h += variableDetailSection();
            var d = node.detail;
            var attentionMessages = [], otherMessages = [];
            if (d && d.messages) {
                for (var messageIndex = 0; messageIndex < d.messages.length; messageIndex++) {
                    var message = d.messages[messageIndex];
                    var record = { message: message, index: messageIndex };
                    if (message.level === 'warning' || message.level === 'error') attentionMessages.push(record);
                    else otherMessages.push(record);
                }
            }

            // 诊断信息优先：失败和警告/错误消息不再藏在完整输入之后。
            if (d && d.failure) h += failureSection(d.failure);
            if (attentionMessages.length) h += messagesSection(attentionMessages, '警告与错误');
            h += variableWriteSummary(node.variableOutputs, VALUES, extraVariableLimit, extraVariableHistories, scopeLabelForId, extraVariableGroups);

            // F2：循环迭代——右详情顶部前置显示完整项值（复用 valuePane：全值 + 复制 + 脱敏，表达式无关）。
            if (node.kind === 'loopIteration' && node.itemValue) {
                h += loopItemSection(node);
            }
            if (node.kind === 'loopExit') h += loopExitSection(node);

            var loopSummary = summarizeLoopIterations(node);
            if (loopSummary.count) h += loopSummarySection(loopSummary);

            if (isContainerKind(node.kind) && !node.detail) {
                h += containerNote(node);
            }
            if (d) {
                if (d.inputs && d.inputs.length) h += inputsSection(d.inputs);
                if (d.outputs && d.outputs.length) h += outputsSection(node, d.outputs);
                if (otherMessages.length) h += messagesSection(otherMessages, '消息');
            }
            return h;
        }

        function breadcrumbBlock(flatIdx) {
            if (flatIdx < 0 || !FLAT[flatIdx]) return '';
            var path = [], i = flatIdx;
            while (i >= 0) {
                path.push(i);
                i = FLAT[i].parent;
            }
            path.reverse();
            var h = '<nav class="qk-breadcrumb" aria-label="节点路径">';
            for (var p = 0; p < path.length; p++) {
                var idx = path[p], node = FLAT[idx].node;
                var label = node.kind === 'step'
                    ? (node.stepId ? '#' + node.stepId + ' ' : '') + (node.title || '(步骤)')
                    : containerLabelPlain(node);

                h += '<button data-select-flat="' + idx + '"' + (idx === flatIdx ? ' disabled' : '') +
                    ' title="' + esc(label) + '">' + esc(label) + '</button>';
            }
            return h + '</nav>';
        }

        function titleBlock(node) {
            var name = node.kind === 'step' ? esc(node.title || '(步骤)') : esc(containerLabelPlain(node));
            var sid = (node.kind === 'step' && node.stepId)
                ? '<span class="qk-dt-sid" data-match-key="step-id">#' + esc(node.stepId) + '</span>' : '';
            var sm = statusMeta(node.status);
            var badge = sm ? '<span class="qk-badge ' + sm.badge + '">' + esc(sm.label) + '</span>' : '';
            var summary = node.kind === 'step' && node.summary
                ? '<div class="qk-dsummary" data-match-key="summary">' + esc(node.summary) + '</div>' : '';
            return '<div class="qk-dtitle"><span class="qk-dt-name" data-match-key="title">' + name + '</span>' + sid + badge + '</div>' +
                summary;
        }

        function metaBlock(node) {
            var parts = [];
            if (node.runnerKey) parts.push('<span title="runnerKey" data-match-key="runner-key">' + esc(node.runnerKey) + '</span>');
            if (node.durationMs !== null && node.durationMs !== undefined) parts.push('耗时 ' + esc(fmtDur(node.durationMs)));
            if (node.elapsedMs !== null && node.elapsedMs !== undefined) {
                parts.push('<span title="墙钟 ' + esc(fmtTimeTitle(META.startedUtc, node.elapsedMs)) + '">起始 +' +
                    esc(Math.round(node.elapsedMs)) + 'ms</span>');
            }
            if (node.delayMs) parts.push('延迟 ' + esc(node.delayMs) + 'ms');
            if (node.disabled) parts.push('已禁用');
            if (node.skipReason) parts.push('跳过：' + (node.skipReason === 'Disabled' ? '已禁用' : esc(node.skipReason)));
            var meta = parts.join(' · ');

            // 新定位信息放在旧协议原本保留的中间段，第三段继续发送 stepId：
            // 新客户端用 SnapshotHash + sourcePath 做安全回链；旧客户端忽略中间段，仍按 stepId 定位。
            var link = '';
            var isPublicSubProgram = node.sourceProgramKind === 'publicSubProgram' && node.sourceProgramId;
            var findTarget = isPublicSubProgram
                ? 'publicSubProgram:' + encodeURIComponent(node.sourceProgramId)
                : META.actionId;
            var findSnapshotHash = isPublicSubProgram ? node.sourceSnapshotHash : META.snapshotHash;
            if (findTarget && (node.sourcePath || node.stepId)) {
                link = '<a href="#" data-find-source="' + esc(node.sourcePath || '') +
                    '" data-find-target="' + esc(findTarget) +
                    '" data-find-hash="' + esc(findSnapshotHash || '') +
                    '" data-findstep="' + esc(node.stepId || '') +
                    '" title="在编辑器中定位该步骤">定位步骤 ↗</a>';
            }
            if (!meta && !link) return '';
            return '<div class="qk-dmeta">' + meta + link + '</div>';
        }

        // F2：循环项值区块——迭代最前面，完整项值经 valuePane 呈现（大值全文可展开、脱敏掩码、可复制）。
        function loopItemSection(node) {
            return '<div class="qk-section qk-loopitem"><h3>循环项值</h3>' +
                '<div class="qk-io"><div class="qk-io-head">' +
                '<span class="qk-io-name">本次循环处理的项</span>' +
                '<span class="qk-io-origin">【值】</span></div>' +
                valuePane(node.itemValue, !!node.itemSensitive, null, 'loop-item') + '</div></div>';
        }

        function loopExitSection(node) {
            var completed = node.completedIterations === null || node.completedIterations === undefined
                ? '—' : node.completedIterations;
            var planned = node.configuredCount === null || node.configuredCount === undefined || node.configuredCount < 0
                ? '无限' : node.configuredCount;
            return '<div class="qk-section qk-loop-exit" data-match-key="loop-exit"><h3>循环提前结束</h3>' +
                '<div class="qk-loop-exit-summary">中止条件在第 <strong>' + esc(node.iterationNumber) +
                '</strong> 次循环体开始前满足；已完成 <strong>' + esc(completed) +
                '</strong> / 计划 <strong>' + esc(planned) + '</strong> 次。</div></div>';
        }

        function loopSummarySection(summary) {
            var h = '<div class="qk-section qk-loop-summary"><h3>循环概览</h3><div class="qk-loop-stats">' +
                '<div><strong>' + summary.count + '</strong><span>迭代次数</span></div>' +
                '<div class="' + (summary.problemCount ? 'qk-loop-problem' : '') + '"><strong>' +
                summary.problemCount + '</strong><span>问题迭代</span></div>';
            if (summary.averageDurationMs !== null) {
                h += '<div><strong>' + esc(fmtDur(summary.averageDurationMs)) + '</strong><span>平均耗时</span></div>' +
                    '<div><strong>' + esc(fmtDur(summary.slowest.durationMs)) + '</strong><span>最慢一次</span></div>';
            }
            h += '</div><div class="qk-loop-links">';
            if (summary.firstProblem && flatIndexById[summary.firstProblem.id] !== undefined) {
                h += '<button data-select-node="' + esc(summary.firstProblem.id) + '">定位首个问题迭代</button>';
            }
            if (summary.slowest && flatIndexById[summary.slowest.id] !== undefined) {
                h += '<button data-select-node="' + esc(summary.slowest.id) + '">定位最慢迭代（第 ' +
                    esc(summary.slowest.iterationNumber) + ' 次）</button>';
            }
            return h + '</div></div>';
        }

        function containerNote(node) {
            var rows = [];
            function row(k, v, matchKey) {
                rows.push('<div' + (matchKey ? ' data-match-key="' + matchKey + '"' : '') +
                    '><span class="qk-cn-k">' + esc(k) + '</span>' + esc(v) + '</div>');
            }
            switch (node.kind) {
                case 'actionRoot': row('节点', '动作根'); break;
                case 'loopIteration': row('循环', '第 ' + node.iterationNumber + ' 次迭代'); break;
                case 'loopExit':
                    row('结果', '中止条件满足，提前结束循环');
                    var completed = node.completedIterations === null || node.completedIterations === undefined
                        ? '—' : node.completedIterations;
                    var planned = node.configuredCount === null || node.configuredCount === undefined
                        ? '—' : (node.configuredCount < 0 ? '无限' : node.configuredCount);
                    row('已完成', completed + ' / ' + planned);
                    break;
                case 'scope': row('作用域', '步骤组 / 分支体'); break;
                case 'parallelScope':
                    row('并行区', '等待模式 ' + (node.waitMode || '—'), 'parallel-wait');
                    row('分支数', node.branchCount);
                    break;
                case 'parallelBranch': row('并行分支', 'Lane ' + node.laneId, 'parallel-lane'); break;
                default: row('节点', node.kind);
            }
            return '<div class="qk-section"><h3>容器信息</h3><div class="qk-container-note">' + rows.join('') + '</div></div>';

        function inputsSection(inputs) {
            var h = '<div class="qk-section qk-io-section"><h3>输入</h3>';
            for (var i = 0; i < inputs.length; i++) h += inputBlock(inputs[i], i);
            return h + '</div>';
        }

        function inputBlock(inp, i) {
            var hasExpr = inp.expression !== null && inp.expression !== undefined && inp.expression !== '';
            var head = '<div class="qk-io-head">' +
                '<span class="qk-io-name" data-match-key="input:' + i + ':param">' + esc(inp.paramName || '(输入)') + '</span>' +
                (inp.origin === 'variable' ? '<button class="qk-variable-link" data-variable-name="' + esc(inp.varName) +
                    '" data-variable-scope="' + esc(inp.variableScopeId == null ? 'unknown' : inp.variableScopeId) + '"' : '<span class="qk-io-origin"') +
                ' data-match-key="input:' + i + ':var">' + esc(originLabel(inp.origin, inp.varName)) + (inp.origin === 'variable' ? '</button>' : '</span>');

            var body;
            if (inp.sensitive) {
                // 兼容旧报告：sensitive=true 时不展示源码/明文。
                body = valuePane(inp.value, true, null, 'input:' + i + ':value');
            } else if (hasExpr) {
                var exprTab = esc(exprTabLabel(inp.origin));
                body = '<div class="qk-io-value-cell qk-io-value-cell-switchable">' +
                    '<span class="qk-seg">' +
                    '<button data-seg="expr">' + exprTab + '</button>' +
                    '<button data-seg="val" class="qk-seg-active">值</button></span>' +
                    '<div class="qk-pane" data-pane="expr" data-match-key="input:' + i + ':expression">' + codeBlock(inp.expression, '') + '</div>' +
                    '<div class="qk-pane qk-pane-active" data-pane="val">' +
                    valuePane(inp.value, false, inp.optionName, 'input:' + i + ':value') + '</div></div>';
            } else {
                body = valuePane(inp.value, false, inp.optionName, 'input:' + i + ':value');
            }
            head += '</div>';
            return '<div class="qk-io qk-io-compact">' + head + body + '</div>';
        }

        function outputsSection(node, outputs) {
            var groups = groupOutputsWithIndices(outputs);
            var h = '<div class="qk-section qk-io-section"><h3>输出</h3>';
            for (var i = 0; i < groups.length; i++) {
                var group = groups[i], latest = group.items[group.items.length - 1];
                if (group.items.length === 1) {
                    h += outputBlock(latest.output, latest.index, null);
                    continue;
                }
                var expandedKey = node.id + ':' + i;
                var expanded = expandedOutputGroups.has(expandedKey);
                h += '<div class="qk-io qk-io-compact qk-output-group"><div class="qk-io-head">' +
                    '<button class="qk-io-name qk-variable-link"' + (latest.output.targetKind === 'Variable' ? ' data-variable-name="' + esc(latest.output.targetName) +
                        '" data-variable-scope="' + esc(latest.output.variableScopeId == null ? 'unknown' : latest.output.variableScopeId) + '"' : ' disabled') +
                    ' data-match-key="output:' + latest.index + ':target">' + esc(outputLabel(latest.output)) + '</button>' +
                    '<span class="qk-io-kind" data-match-key="output:' + latest.index + ':kind">' + esc(group.targetKind || '') + '</span>' +
                    '<span class="qk-output-count">更新 ' + group.items.length + ' 次，当前为最终值</span>' +
                    '<button class="qk-output-toggle" data-output-group="' + i + '">' +
                    (expanded ? '收起历史' : '查看全部历史') + '</button></div>' +
                    valuePane(latest.output.value, !!latest.output.sensitive, null, 'output:' + latest.index + ':value');
                if (expanded) {
                    h += '<div class="qk-output-history">';
                    for (var j = 0; j < group.items.length; j++) {
                        var item = group.items[j];
                        h += '<div class="qk-output-history-row"><span>第 ' + (j + 1) + ' 次</span>' +
                            valuePane(item.output.value, !!item.output.sensitive, null,
                                'output:' + item.index + ':value') + '</div>';
                    }
                    h += '</div>';
                }
                h += '</div>';
            }
            return h + '</div>';
        }

        function groupOutputsWithIndices(outputs) {
            var groups = [], byKey = Object.create(null);
            for (var i = 0; i < outputs.length; i++) {
                var output = outputs[i];
                var key = outputGroupKey(output);
                var group = byKey[key];
                if (!group) {
                    group = { targetName: output.targetName, targetKind: output.targetKind, items: [] };
                    byKey[key] = group;
                    groups.push(group);
                }
                group.items.push({ output: output, index: i });
            }
            return groups;
        }

        function outputBlock(output, outputIndex, note) {
            return '<div class="qk-io qk-io-compact"><div class="qk-io-head">' +
                '<button class="qk-io-name qk-variable-link"' + (output.targetKind === 'Variable' ? ' data-variable-name="' + esc(output.targetName) +
                    '" data-variable-scope="' + esc(output.variableScopeId == null ? 'unknown' : output.variableScopeId) + '"' : ' disabled') +
                ' data-match-key="output:' + outputIndex + ':target">' + esc(outputLabel(output)) + '</button>' +
                '<span class="qk-io-kind" data-match-key="output:' + outputIndex + ':kind">' + esc(output.targetKind || '') + '</span>' +
                (note ? '<span class="qk-output-count">' + esc(note) + '</span>' : '') + '</div>' +
                valuePane(output.value, !!output.sensitive, null, 'output:' + outputIndex + ':value') + '</div>';
        }

        function messagesSection(messages, title) {
            var h = '<div class="qk-section"><h3>' + esc(title || '消息') + '</h3>';
            for (var i = 0; i < messages.length; i++) {
                var record = messages[i];
                var m = record.message || record;
                var messageIndex = record.index !== undefined ? record.index : i;
                var matchAttr = ' data-match-key="message:' + messageIndex + '"';
                if (m.level === 'raw') {
                    // 复现 AddRawContent：原始 HTML 片段逐字保真（innerHTML）。
                    h += '<div class="qk-msg"' + matchAttr + '>' + (m.text || '') + '</div>';
                } else {
                    var cls = m.level === 'error' ? 'qk-msg-error' : (m.level === 'warning' ? 'qk-msg-warning' : 'qk-msg-info');
                    var prefix = m.code ? '[降级 ' + esc(m.code) + '] ' : '';
                    h += '<div class="qk-msg ' + cls + '"' + matchAttr + '>' + prefix + esc(m.text) + '</div>';
                }
            }
            return h + '</div>';
        }

        function repeatText(text, count) {
            var result = '';
            while (count-- > 0) result += text;
            return result;
        }

        function expandTabsForMarker(text, tabSize) {
            var result = '', column = 0;
            for (var i = 0; i < text.length; i++) {
                if (text.charAt(i) === '\t') {
                    var spaces = tabSize - (column % tabSize);
                    result += repeatText(' ', spaces);
                    column += spaces;
                } else {
                    result += ' ';
                    column++;
                }
            }
            return result;
        }

        function expressionDiagnosticFrame(diagnostic) {
            if (!diagnostic) return '';
            var hasFullSource = diagnostic.sourceCode !== null && diagnostic.sourceCode !== undefined;
            var source = hasFullSource ? String(diagnostic.sourceCode) : String(diagnostic.codeSnippet || '');
            if (!source) return '';

            // JSON 解析后会还原 CRLF/LF；仅在显示层统一分行，复制仍使用原始 source。
            var lines = source.replace(/\r\n?/g, '\n').split('\n');
            var line = hasFullSource ? Number(diagnostic.line || 1) : 1;
            var column = hasFullSource ? Number(diagnostic.column || 1) : 1;
            line = Math.max(1, Math.min(lines.length, isFinite(line) ? line : 1));
            column = Math.max(1, isFinite(column) ? column : 1);

            var start = Math.max(0, line - 1 - 2);
            var end = Math.min(lines.length, line + 2);
            var width = String(end).length;
            var frame = [];
            if (start > 0) frame.push(repeatText(' ', width) + ' | …');
            for (var i = start; i < end; i++) {
                var number = repeatText(' ', width - String(i + 1).length) + String(i + 1);
                frame.push(number + ' | ' + lines[i]);
                if (i === line - 1) {
                    var before = lines[i].slice(0, Math.min(column - 1, lines[i].length));
                    frame.push(repeatText(' ', width) + ' | ' + expandTabsForMarker(before, 4) + '^');
                }
            }
            if (end < lines.length) frame.push(repeatText(' ', width) + ' | …');

            var stage = diagnostic.stage === 'Parse' ? '语法/解析阶段' : '运行阶段';
            var location = diagnostic.line && diagnostic.column
                ? '位置 ' + diagnostic.line + ':' + diagnostic.column
                : '位置未知';
            var cid = copyTexts.push(source) - 1;
            return '<div class="qk-expression-diagnostic">' +
                '<div class="qk-vmeta">' + esc(diagnostic.engine || '表达式') + ' · ' + esc(stage) + ' · ' +
                esc(location) + '<button class="qk-copy" data-copy="' + cid + '">复制源码</button></div>' +
                '<pre class="qk-code-frame" data-match-key="failure:diagnostic-source">' + esc(frame.join('\n')) + '</pre></div>';
        }

        function failureSection(fail) {
            var diagnostic = fail.expressionDiagnostic;
            var message = diagnostic && diagnostic.message ? diagnostic.message : fail.message;
            var h = '<div class="qk-section"><h3>失败</h3><div class="qk-failure">' +
                '<div class="qk-fail-msg" data-match-key="failure:message">' + esc(message || '(无消息)') + '</div>';
            h += expressionDiagnosticFrame(diagnostic);
            if (fail.stack) {
                var cid = copyTexts.push(fail.stack) - 1;
                h += '<div class="qk-vmeta">堆栈<button class="qk-copy" data-copy="' + cid + '">复制</button></div>' +
                    '<pre class="qk-stack" data-match-key="failure:stack">' + esc(fail.stack) + '</pre>';
            }
            return h + '</div></div>';
        }

        // 完整值面板：等宽、可滚动、可复制；旧报告 sensitive 恒掩码；附件给相对链接；截断标注。
        function valuePane(cell, sensitive, optionName, matchKey) {
            var r = resolveValue(cell, VALUES);
            if (sensitive) r = { kind: 'masked', typeName: r.typeName };

            if (r.kind === 'null') return wrapSearchTarget('<pre class="qk-value qk-value-null">*NULL*</pre>', matchKey);
            if (r.kind === 'masked') return wrapSearchTarget('<pre class="qk-value qk-value-masked">******</pre>', matchKey);
            if (r.kind === 'attachment') {
                var href = 'attachments/' + r.attachmentRef;
                return wrapSearchTarget('<div class="qk-vmeta">' + esc(r.typeName || '') + '</div>' +
                    '<div class="qk-attach"><a href="' + esc(href) + '">查看附件（' + esc(r.attachmentRef) + '）</a></div>', matchKey);
            }
            var text = r.kind === 'full' ? r.content : r.text;
            var metaHtml = '';
            if (r.kind === 'full') {
                metaHtml = esc(r.typeName || '') + (r.truncated ? ' <span class="qk-vtrunc">（值已因预算截断）</span>' : '');
            } else if (r.note) {
                metaHtml = esc(r.note);
            }
            return wrapSearchTarget(valueBox(metaHtml, text, optionName), matchKey);
        }

        function wrapSearchTarget(html, matchKey) {
            return matchKey
                ? '<div class="qk-search-target" data-match-key="' + esc(matchKey) + '">' + html + '</div>'
                : html;
        }

        // 源码/文本块（表达式面板、堆栈等）：可复制。
        function codeBlock(text, metaLabel) {
            return valueBox(metaLabel ? esc(metaLabel) : '', text);
        }

        // 值/代码块通用外壳：复制按钮绝对定位到右上角、悬停显现（不再独占一行）。
        function valueBox(metaHtml, text, optionName) {
            var cid = copyTexts.push(text == null ? '' : text) - 1;
            var showOptionName = optionName &&
                String(optionName).toLowerCase() !== String(text).toLowerCase();
            var valueHtml = showOptionName
                ? '<div class="qk-value qk-option-value"><span class="qk-option-title">' +
                    esc(optionName) + '</span><code class="qk-option-raw">' + esc(text) + '</code></div>'
                : '<pre class="qk-value">' + esc(text) + '</pre>';
            return '<div class="qk-valwrap">' +
                (metaHtml ? '<div class="qk-vmeta">' + metaHtml + '</div>' : '') +
                '<button class="qk-copy" data-copy="' + cid + '" title="复制完整内容">复制</button>' +
                valueHtml + '</div>';
        }

        function prepareDetailForSearchMatch(match) {
            if (match && match.variableOutputIndex !== undefined && selectedFlatIdx >= 0) {
                var item = FLAT[selectedFlatIdx].node.variableOutputs[match.variableOutputIndex];
                activeVariableAccess = { flatIdx: selectedFlatIdx, item: item, itemIndex: match.variableOutputIndex,
                    name: item.targetName, kind: 'write', scopeId: item.variableScopeId == null ? 'unknown' : String(item.variableScopeId) };
                return;
            }
            if (!match || match.outputIndex === undefined || selectedFlatIdx < 0) return;
            var node = FLAT[selectedFlatIdx].node;
            var outputs = node.detail && node.detail.outputs;
            if (!outputs) return;
            var groups = groupOutputsWithIndices(outputs);
            for (var i = 0; i < groups.length; i++) {
                for (var j = 0; j < groups[i].items.length; j++) {
                    if (groups[i].items[j].index === match.outputIndex && groups[i].items.length > 1) {
                        expandedOutputGroups.add(node.id + ':' + i);
                        return;
                    }
                }
            }
        }

        function highlightCurrentSearchMatch() {
            if (!query || currentSearchMatch < 0 || !searchMatches[currentSearchMatch]) return;
            var match = searchMatches[currentSearchMatch];
            if (match.flatIdx !== selectedFlatIdx) return;
            focusDetailMatch(match, query, false);
        }

        function highlightVariableAccess() {
            if (!activeVariableAccess || activeVariableAccess.flatIdx !== selectedFlatIdx) return;
            var match = variableParameterMatch(FLAT[selectedFlatIdx].node, activeVariableAccess);
            if (match) focusDetailMatch(match, '', true);
        }

        function focusDetailMatch(match, searchText, wholeRow) {
            var target = detailEl.querySelector('[data-match-key="' + match.key + '"]');
            if (!target) return;

            var pane = target.classList && target.classList.contains('qk-pane')
                ? target : closest(target, 'qk-pane', detailEl);
            if (pane) {
                var io = closest(pane, 'qk-io', detailEl);
                if (io) {
                    var panes = io.querySelectorAll('.qk-pane');
                    for (var p = 0; p < panes.length; p++) panes[p].classList.toggle('qk-pane-active', panes[p] === pane);
                    var buttons = io.querySelectorAll('.qk-seg button');
                    for (var b = 0; b < buttons.length; b++) {
                        buttons[b].classList.toggle('qk-seg-active', buttons[b].getAttribute('data-seg') === pane.getAttribute('data-pane'));
                    }
                }
            }

            var highlighted = wholeRow ? closest(target, 'qk-output-history-row', detailEl) || closest(target, 'qk-io', detailEl) || target : target;
            highlighted.classList.add('qk-search-current');
            if (wholeRow) { highlighted.setAttribute('tabindex', '-1'); highlighted.focus({ preventScroll: true }); }
            if (searchText) markSearchTextNodes(target, searchText);
            try { target.scrollIntoView({ block: 'center', inline: 'nearest' }); }
            catch (e) { try { target.scrollIntoView(); } catch (ignore) { /* 旧 WebView */ } }
        }

        function markSearchTextNodes(root, searchText) {
            if (!root || !searchText) return;
            var qLower = searchText.toLowerCase();
            var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
            var textNodes = [], node;
            while ((node = walker.nextNode())) {
                var parent = node.parentElement;
                if (!parent || (parent.classList && parent.classList.contains('qk-copy'))) continue;
                if (node.nodeValue && node.nodeValue.toLowerCase().indexOf(qLower) >= 0) textNodes.push(node);
            }
            for (var i = 0; i < textNodes.length; i++) {
                var text = textNodes[i].nodeValue;
                var lower = text.toLowerCase();
                var fragment = document.createDocumentFragment();
                var start = 0, at;
                while ((at = lower.indexOf(qLower, start)) >= 0) {
                    if (at > start) fragment.appendChild(document.createTextNode(text.slice(start, at)));
                    var mark = document.createElement('mark');
                    mark.className = 'qk-search-mark';
                    mark.textContent = text.slice(at, at + searchText.length);
                    fragment.appendChild(mark);
                    start = at + searchText.length;
                }
                if (start < text.length) fragment.appendChild(document.createTextNode(text.slice(start)));
                textNodes[i].parentNode.replaceChild(fragment, textNodes[i]);
            }
        }

        // ---- 详情交互：分段切换 / 复制 / findstep ----
        function onDetailClick(e) {
            var extraValue = e.target.closest('[data-extra-index]');
            if (extraValue) {
                prepareDetailForSearchMatch({ variableOutputIndex: Number(extraValue.getAttribute('data-extra-index')) });
                detailEl.innerHTML = renderDetail(FLAT[selectedFlatIdx].node);
                highlightCurrentSearchMatch();
                highlightVariableAccess();
                detailEl.scrollTop = 0;
                var target = document.getElementById('qk-variable-selected');
                if (target) target.focus({ preventScroll: true });
                return;
            }
            var extraHistory = e.target.closest('[data-extra-history]'), extraMore = e.target.closest('[data-extra-more]');
            if (extraHistory || extraMore) {
                if (extraHistory) extraVariableHistories.set(Number(extraHistory.getAttribute('data-extra-history')), Number(extraHistory.getAttribute('data-extra-count')));
                else extraVariableLimit += 20;
                var scrollTop = detailEl.scrollTop;
                detailEl.innerHTML = renderDetail(FLAT[selectedFlatIdx].node);
                highlightCurrentSearchMatch();
                highlightVariableAccess();
                detailEl.scrollTop = scrollTop;
                var next;
                if (extraHistory) {
                    var group = detailEl.querySelector('[data-extra-group="' + extraHistory.getAttribute('data-extra-history') + '"]');
                    next = extraHistory.hasAttribute('data-extra-history-more')
                        ? group.querySelector('[data-extra-history-more]') || group.querySelector('.qk-write-history .qk-write-preview:last-of-type')
                        : group.querySelector('[data-extra-history]');
                } else next = detailEl.querySelector('[data-extra-more]');
                // 继续加载时让新按钮（或最后一条记录）进入可视区，避免历史容器重建后焦点不可见。
                (next || detailEl.querySelector('.qk-write-summary h3')).focus({
                    preventScroll: !extraHistory || !extraHistory.hasAttribute('data-extra-history-more')
                });
                return;
            }
            var variableOpen = e.target.closest('[data-variable-open]');
            if (variableOpen) {
                pendingVariableSelection = { name: '', scopeId: null, mode: 'write' };
                setVariablePanelOpen(true);
                return;
            }
            var variableLink = e.target.closest('[data-variable-name]');
            if (variableLink) {
                pendingVariableSelection = { name: variableLink.getAttribute('data-variable-name'), scopeId: variableLink.getAttribute('data-variable-scope') || 'unknown' };
                setVariablePanelOpen(true);
                return;
            }
            var directTarget = e.target;
            if (directTarget && directTarget.getAttribute) {
                var selectFlat = directTarget.getAttribute('data-select-flat');
                if (selectFlat !== null) {
                    selectByFlatIdx(parseInt(selectFlat, 10), true);
                    e.preventDefault();
                    return;
                }
                var selectNode = directTarget.getAttribute('data-select-node');
                if (selectNode !== null && flatIndexById[selectNode] !== undefined) {
                    selectByFlatIdx(flatIndexById[selectNode], true);
                    e.preventDefault();
                    return;
                }
                var outputGroup = directTarget.getAttribute('data-output-group');
                if (outputGroup !== null && selectedFlatIdx >= 0) {
                    var selectedNode = FLAT[selectedFlatIdx].node;
                    var expandedKey = selectedNode.id + ':' + outputGroup;
                    if (expandedOutputGroups.has(expandedKey)) expandedOutputGroups.delete(expandedKey);
                    else expandedOutputGroups.add(expandedKey);
                    var scrollTop = detailEl.scrollTop;
                    detailEl.innerHTML = renderDetail(selectedNode);
                    detailEl.scrollTop = scrollTop;
                    highlightCurrentSearchMatch();
                    highlightVariableAccess();
                    e.preventDefault();
                    return;
                }
            }
            var seg = closest(e.target, 'qk-seg', detailEl);
            var segBtn = e.target && e.target.getAttribute && e.target.getAttribute('data-seg');
            if (seg && segBtn) {
                var io = closest(e.target, 'qk-io', detailEl);
                if (io) {
                    var btns = seg.querySelectorAll('button');
                    for (var b = 0; b < btns.length; b++) btns[b].classList.remove('qk-seg-active');
                    e.target.classList.add('qk-seg-active');
                    var panes = io.querySelectorAll('.qk-pane');
                    for (var p = 0; p < panes.length; p++) {
                        panes[p].classList.toggle('qk-pane-active', panes[p].getAttribute('data-pane') === segBtn);
                    }
                }
                e.preventDefault();
                return;
            }
            var copyBtn = e.target;
            if (copyBtn && copyBtn.classList && copyBtn.classList.contains('qk-copy')) {
                var ci = parseInt(copyBtn.getAttribute('data-copy'), 10);
                copyText(copyTexts[ci] || '');
                var old = copyBtn.textContent;
                copyBtn.textContent = '已复制';
                copyBtn.classList.add('qk-copied');
                setTimeout(function () { copyBtn.textContent = old; copyBtn.classList.remove('qk-copied'); }, 1200);
                e.preventDefault();
                return;
            }
            var fs = e.target;
            if (fs && fs.getAttribute && fs.getAttribute('data-findstep') != null) {
                var findTarget = fs.getAttribute('data-find-target') || META.actionId;
                if (findTarget) {
                    var sourcePath = fs.getAttribute('data-find-source') || '';
                    var findHash = fs.getAttribute('data-find-hash') || META.snapshotHash;
                    var sourceLocator = sourcePath && findHash
                        ? encodeURIComponent(findHash + ',' + sourcePath)
                        : '';
                    nav('quicker:findstep:' + findTarget + ';' + sourceLocator + ';' +
                        (fs.getAttribute('data-findstep') || ''));
                }
                e.preventDefault();
            }
        }

        // ---- 分隔条拖动 ----
        function wireSplitter() {
            var dragging = false;
            splitterEl.addEventListener('mousedown', function (e) {
                dragging = true;
                splitterEl.classList.add('qk-dragging');
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });
            window.addEventListener('mousemove', function (e) {
                if (!dragging) return;
                var mainRect = document.getElementById('qk-main').getBoundingClientRect();
                var w = e.clientX - mainRect.left;
                w = Math.max(200, Math.min(mainRect.width - 260, w));
                treePaneEl.style.width = w + 'px';
                requestRender();
            });
            window.addEventListener('mouseup', function () {
                if (!dragging) return;
                dragging = false;
                splitterEl.classList.remove('qk-dragging');
                document.body.style.userSelect = '';
            });
        }

        // ---- 工具 ----
        function nav(url) { try { window.open(url, '_self'); } catch (e) { location.href = url; } }

        function copyText(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return; }
            } catch (e) { /* 回退 execCommand */ }
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            try { document.execCommand('copy'); } catch (e2) { /* 忽略 */ }
            document.body.removeChild(ta);
        }

        function closest(el, cls, stop) {
            while (el && el !== stop) {
                if (el.classList && el.classList.contains(cls)) return el;
                el = el.parentElement;
            }
            return null;
        }
    }

    var api = {
        createVariableScopeLabeler: createVariableScopeLabeler,
        variableWriteSummary: variableWriteSummary,
        variableParameterMatch: variableParameterMatch,
        createVariableCandidateSelector: createVariableCandidateSelector, variableListPreview: variableListPreview,
        variablePanelHeight: variablePanelHeight,
        collectVariableAccesses: collectVariableAccesses, filterVariableAccesses: filterVariableAccesses,
        buildVariableIndexAsync: buildVariableIndexAsync, lookupVariableAccesses: lookupVariableAccesses,
        lookupVariableAccessesAsync: lookupVariableAccessesAsync,
        esc: esc, isContainerKind: isContainerKind, flattenTree: flattenTree,
        createDefaultCollapsed: createDefaultCollapsed,
        nodeStatusMatches: nodeStatusMatches, nodeSearchText: nodeSearchText, nodeMatchesSearch: nodeMatchesSearch,
        searchableValueText: searchableValueText, collectNodeSearchMatches: collectNodeSearchMatches,
        collectSearchMatches: collectSearchMatches, buildSearchMatchCounts: buildSearchMatchCounts,
        computeVisible: computeVisible, findNextIndex: findNextIndex, findVisibleNeighbor: findVisibleNeighbor,
        isDescendantOf: isDescendantOf, selectionAfterCollapse: selectionAfterCollapse, isFailedNode: isFailedNode,
        hasAttentionMessage: hasAttentionMessage, isAttentionNode: isAttentionNode, summarizeFlat: summarizeFlat,
        topSlowSteps: topSlowSteps, summarizeLoopIterations: summarizeLoopIterations, groupOutputs: groupOutputs, outputLabel: outputLabel,
        resolveValue: resolveValue, originLabel: originLabel, exprTabLabel: exprTabLabel,
        parseOffsetMin: parseOffsetMin, fmtTimeTitle: fmtTimeTitle, fmtDur: fmtDur, markHits: markHits
    };

    if (typeof module !== 'undefined' && module.exports) {
        module.exports = api;
    } else {
        global.QuickerDebugViewer = api;
    }

    if (typeof document !== 'undefined') {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootViewer);
        } else {
            bootViewer();
        }
    }
})(typeof globalThis !== 'undefined' ? globalThis : this);
